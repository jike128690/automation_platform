[project]
name = "automation-platform"
version = "0.1.0"
description = "Web自动化测试平台 v2.5（Windows 桌面端，PyQt6 + Playwright）"
requires-python = ">=3.12"
dependencies = [
    "PyQt6",
    "PyQt6-Fluent-Widgets",
    "alembic>=1.20.0",
    "loguru>=0.7.3",
    "playwright==1.63.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.5",
    "websocket>=0.2.1",
    "websocket-client>=1.9.2",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
